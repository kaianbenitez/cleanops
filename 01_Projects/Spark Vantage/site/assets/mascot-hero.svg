<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 580" width="400" height="580" role="img" aria-label="Spark, the Spark Vantage bunny mascot, wearing a headset with arms crossed">
  <defs>
    <style>
      .o{stroke:#1B1F30;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
      .fur{fill:#F4EFE4}
      .furLt{fill:#FCFAF5}
      .ear{fill:#FF9A8C}
      .navy{fill:#1B1F30}
      .red{fill:#E0261B}
      .redDk{fill:#B81D14}
      .ln{fill:none;stroke:#1B1F30;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <ellipse cx="200" cy="548" rx="124" ry="18" fill="#000" opacity=".18"/>

  <!-- ============ EARS ============ -->
  <g class="o">
    <path class="fur" d="M174 136C152 96 140 52 152 32c12-19 36-9 42 24 5 28 3 62 4 80z"/>
    <path class="fur" d="M226 136c22-40 34-84 22-104-12-19-36-9-42 24-5 28-3 62-4 80z"/>
  </g>
  <path class="ear" d="M177 122C162 92 155 60 161 46c6-12 17-4 21 19 4 20 2 44 2 57z"/>
  <path class="ear" d="M223 122c15-30 22-62 16-76-6-12-17-4-21 19-4 20-2 44-2 57z"/>

  <!-- ============ TORSO ============ -->
  <g class="o">
    <path class="fur" d="M200 240c40 0 68 22 72 60l6 76c3 32-16 52-48 52h-60c-32 0-51-20-48-52l6-76c4-38 32-60 72-60z"/>
  </g>
  <path class="red" d="M200 246c37 0 63 20 67 56l6 74c3 28-14 46-43 46h-60c-29 0-46-18-43-46l6-74c4-36 30-56 67-56z"/>
  <path class="redDk" d="M267 302l6 74c3 28-14 46-43 46h-20c29 0 46-18 43-46l-6-74c-3-30-22-49-51-55 40 0 68 20 71 55z"/>
  <path class="ln" stroke-width="6" d="M200 246c37 0 63 20 67 56l6 74c3 28-14 46-43 46h-60c-29 0-46-18-43-46l6-74c4-36 30-56 67-56z"/>

  <!-- collar -->
  <path class="furLt o" d="M166 240h68c-3 18-14 30-34 30s-31-12-34-30z"/>

  <!-- chest badge -->
  <rect class="furLt o" x="182" y="278" width="38" height="38" rx="12"/>
  <path class="red" d="M206 283l-16 18h8l-4 14 16-18h-8z"/>

  <!-- ============ LEGS + FEET ============ -->
  <g class="o">
    <rect class="redDk" x="150" y="416" width="44" height="86" rx="22"/>
    <rect class="redDk" x="206" y="416" width="44" height="86" rx="22"/>
    <path class="fur" d="M174 490c14 0 23 11 23 24 0 13-9 22-26 22h-44c-17 0-26-7-26-18 0-15 21-22 38-27 13-4 22-1 35-1z"/>
    <path class="fur" d="M226 490c-14 0-23 11-23 24 0 13 9 22 26 22h44c17 0 26-7 26-18 0-15-21-22-38-27-13-4-22-1-35-1z"/>
  </g>

  <!-- ============ CROSSED ARMS ============ -->
  <g transform="rotate(6 200 369)">
    <rect class="redDk o" x="136" y="350" width="128" height="38" rx="19"/>
    <ellipse class="fur o" cx="264" cy="369" rx="22" ry="20"/>
  </g>
  <g transform="rotate(-6 200 351)">
    <rect class="red o" x="136" y="332" width="128" height="38" rx="19"/>
    <ellipse class="fur o" cx="136" cy="351" rx="22" ry="20"/>
  </g>

  <!-- ============ HEAD ============ -->
  <ellipse class="fur o" cx="200" cy="178" rx="84" ry="76"/>

  <!-- headband -->
  <path class="ln" stroke-width="15" d="M117 190c-2-54 35-82 83-82s85 28 83 82"/>

  <ellipse class="furLt" cx="200" cy="210" rx="49" ry="33"/>

  <circle class="ear" cx="143" cy="204" r="15" opacity=".6"/>
  <circle class="ear" cx="257" cy="204" r="15" opacity=".6"/>

  <g class="ln" stroke-width="3" opacity=".5">
    <path d="M151 200l-31-9M149 210h-33M151 220l-30 10"/>
    <path d="M249 200l31-9M251 210h33M249 220l30 10"/>
  </g>

  <ellipse class="navy" cx="168" cy="174" rx="11" ry="14"/>
  <ellipse class="navy" cx="232" cy="174" rx="11" ry="14"/>
  <circle fill="#FFFFFF" cx="172" cy="168" r="4.5"/>
  <circle fill="#FFFFFF" cx="236" cy="168" r="4.5"/>

  <g class="ln" stroke-width="6">
    <path d="M153 150c6-5 16-6 24-3"/>
    <path d="M247 150c-6-5-16-6-24-3"/>
  </g>

  <path class="navy" d="M200 192c9 0 13 5 9 11-4 5-14 5-18 0-4-6 0-11 9-11z"/>
  <path class="ln" stroke-width="4" d="M200 203v8M200 211c-5 8-15 7-18 1M200 211c5 8 15 7 18 1"/>

  <!-- earcups + mic -->
  <rect class="navy o" x="96" y="160" width="38" height="62" rx="19"/>
  <rect class="navy o" x="266" y="160" width="38" height="62" rx="19"/>
  <ellipse fill="#3A4160" cx="115" cy="191" rx="10" ry="20"/>
  <ellipse fill="#3A4160" cx="285" cy="191" rx="10" ry="20"/>
  <path class="ln" stroke-width="9" d="M114 218c2 12 16 20 34 20"/>
  <circle class="red o" cx="151" cy="238" r="10"/>
</svg>
