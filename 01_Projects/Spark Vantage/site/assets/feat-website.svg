  <rect fill="#FFFFFF" x="92" y="118" width="118" height="13" rx="6"/>
  <rect fill="#FFFFFF" x="92" y="140" width="80" height="9" rx="4" opacity=".5"/>
  <rect class="rd" x="92" y="158" width="92" height="20" rx="10"/>
