<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="Phone showing an automated review request and a resulting five star Google review">
  <defs><style>
    .nv{fill:#1B1F30}.wh{fill:#FFFFFF}.g1{fill:#EEF0F4}.rd{fill:#E0261B}.mt{fill:#8A90A0}.st{fill:#F5A524}
  </style>
    <path id="star" d="M9 0l2.6 5.6 6.1.8-4.5 4.3 1.2 6.1L9 13.9 3.6 16.8l1.2-6.1L.3 6.4l6.1-.8z"/>
  </defs>

  <!-- phone -->
  <g transform="translate(56 30)">
    <rect fill="#000" opacity=".14" x="8" y="14" width="228" height="372" rx="34"/>
    <rect class="nv" x="0" y="0" width="228" height="374" rx="34"/>
    <rect class="wh" x="11" y="11" width="206" height="352" rx="25"/>
    <rect class="nv" x="82" y="20" width="64" height="10" rx="5"/>

    <!-- header -->
    <rect class="rd" x="11" y="38" width="206" height="52"/>
    <circle fill="#FFFFFF" cx="42" cy="64" r="13" opacity=".95"/>
    <rect fill="#FFFFFF" x="64" y="55" width="88" height="9" rx="4.5"/>
    <rect fill="#FFFFFF" x="64" y="70" width="56" height="7" rx="3.5" opacity=".6"/>

    <!-- outbound review request -->
    <rect class="g1" x="26" y="106" width="150" height="58" rx="14"/>
    <g class="mt">
      <rect x="38" y="119" width="122" height="7" rx="3.5"/>
      <rect x="38" y="132" width="108" height="7" rx="3.5"/>
      <rect x="38" y="145" width="70" height="7" rx="3.5"/>
    </g>

    <!-- reminder chip -->
    <rect fill="#FFF1EF" x="26" y="176" width="132" height="26" rx="13"/>
    <circle class="rd" cx="42" cy="189" r="6"/>
    <rect fill="#B81D14" x="56" y="185" width="86" height="8" rx="4"/>

    <!-- star rating tap -->
    <rect class="nv" x="26" y="216" width="176" height="66" rx="16"/>
    <rect fill="#FFFFFF" x="40" y="230" width="92" height="8" rx="4" opacity=".6"/>
    <g class="st" transform="translate(40 250)">
      <use href="#star"/><use href="#star" x="30"/><use href="#star" x="60"/><use href="#star" x="90"/><use href="#star" x="120"/>
    </g>

    <!-- sent confirmation -->
    <rect fill="#E7F5EC" x="26" y="296" width="150" height="46" rx="14"/>
    <circle fill="#1F8A4C" cx="48" cy="319" r="12"/>
    <path fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M42 319l4 4 8-8"/>
    <rect fill="#1F8A4C" x="68" y="309" width="90" height="7" rx="3.5" opacity=".8"/>
    <rect fill="#1F8A4C" x="68" y="322" width="62" height="7" rx="3.5" opacity=".45"/>
  </g>

  <!-- resulting review card -->
  <g transform="translate(300 108)">
    <rect fill="#000" opacity=".12" x="6" y="12" width="216" height="164" rx="20"/>
    <rect class="wh" x="0" y="0" width="216" height="166" rx="20"/>
    <rect fill="none" stroke="#E3E6ED" stroke-width="2" x="1" y="1" width="214" height="164" rx="20"/>

    <circle fill="#EEF0F4" cx="36" cy="38" r="18"/>
    <circle fill="#C3C9D4" cx="36" cy="33" r="7"/>
    <path fill="#C3C9D4" d="M36 43c8 0 13 5 13 10v3H23v-3c0-5 5-10 13-10z"/>
    <rect fill="#1B1F30" x="64" y="28" width="82" height="9" rx="4.5"/>
    <rect class="mt" x="64" y="44" width="54" height="7" rx="3.5"/>

    <g class="st" transform="translate(22 70)">
      <use href="#star"/><use href="#star" x="26"/><use href="#star" x="52"/><use href="#star" x="78"/><use href="#star" x="104"/>
    </g>
    <g fill="#C6CBD5">
      <rect x="22" y="104" width="172" height="8" rx="4"/>
      <rect x="22" y="120" width="172" height="8" rx="4"/>
      <rect x="22" y="136" width="112" height="8" rx="4"/>
    </g>
  </g>
</svg>
