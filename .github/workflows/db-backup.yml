name: Nightly database backup

on:
  schedule:
    - cron: "0 9 * * *" # ~3-4am Central, daily
  workflow_dispatch: {} # lets you trigger a backup manually from the Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          mkdir -p dump
          STAMP=$(date -u +'%Y-%m-%dT%H-%M-%SZ')
          # Strip an accidental pasted CR/LF from the repository secret.
          CLEAN_DATABASE_URL="$(printf '%s' "$DATABASE_URL" | tr -d '\r\n')"
          if [ -z "$CLEAN_DATABASE_URL" ]; then
            echo "DATABASE_URL is empty" >&2
            exit 1
          fi
          pg_dump "$CLEAN_DATABASE_URL" -Fc -f "dump/cleanops-${STAMP}.dump"
          echo "STAMP=${STAMP}" >> "$GITHUB_ENV"

      - name: Checkout backup repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.BACKUP_REPO }}
          token: ${{ secrets.BACKUP_REPO_TOKEN }}
          path: backup-repo

      - name: Copy dump into backup repo and commit
        run: |
          cp dump/cleanops-*.dump backup-repo/
          cd backup-repo
          git config user.name "cleanops-backup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "cleanops-${STAMP}.dump"
          git commit -m "Backup ${STAMP}"
          git push

      - name: Prune backups older than 30 days
        run: |
          cd backup-repo
          find . -maxdepth 1 -name "cleanops-*.dump" -mtime +30 -print -delete
          if ! git diff --quiet --cached || [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Prune backups older than 30 days" || true
            git push || true
          fi
